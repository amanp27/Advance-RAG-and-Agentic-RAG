[project]
name = "14-multimodal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aman Prajapati", email = "amanprajapati22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "open-clip-torch>=3.3.0",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "unstructured[local-inference,pdf]>=0.27.5",
]

[project.scripts]
14-multimodal-rag = "14_multimodal_rag:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
